<div class="form-container">
  <h2>Register a New Customer</h2>
  <p>Please enter the customer details below.</p>

  <form (ngSubmit)="onSubmit()" #customerForm="ngForm" class="customer-form">
    
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" [(ngModel)]="customer.CustomerName" required placeholder="Enter full name">
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" [(ngModel)]="customer.email" required placeholder="Enter email address">
    </div>

    <div class="form-group">
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" [(ngModel)]="customer.phoneNumber" required placeholder="Enter phone number">
    </div>

    <div class="button-group">
      <button type="submit" class="submit-btn" [disabled]="!customerForm.valid">Save Customer</button>
      <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
